name: Wing release tarballs

on:
  pull_request:
    paths:
      - "packages/code-core/**"
      - "packages/cad-contracts/**"
      - "packages/cad-core/**"
      - "packages/db-node/**"
      - "packages/workspace-schema/**"
      - "packages/cad-rust-source/**"
      - "scripts/verify-cad-rust-tarball.mjs"
      - "scripts/verify-package-tarballs.mjs"
      - "scripts/verify-release-matrix.mjs"
      - "release-matrix.json"
      - "package.json"
      - ".github/workflows/cad-rust-source.yml"
  push:
    paths:
      - "packages/code-core/**"
      - "packages/cad-contracts/**"
      - "packages/cad-core/**"
      - "packages/db-node/**"
      - "packages/workspace-schema/**"
      - "packages/cad-rust-source/**"
      - "scripts/verify-cad-rust-tarball.mjs"
      - "scripts/verify-package-tarballs.mjs"
      - "scripts/verify-release-matrix.mjs"
      - "release-matrix.json"
      - "package.json"
      - ".github/workflows/cad-rust-source.yml"
  workflow_dispatch:

jobs:
  tarball-release-test:
    name: ${{ matrix.os }} / npm tarball / release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify lockstep Wing release matrix
        run: npm run verify:release-matrix -- --wing-only
      - name: Pack, extract and test release workspace
        run: npm run verify:cad-rust-tarball
      - name: Pack and install TypeScript package tarballs
        run: npm run verify:package-tarballs
