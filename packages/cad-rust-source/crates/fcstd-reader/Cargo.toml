[package]
name = "fcstd-reader"
version = "0.1.0"
edition = "2021"
description = "cad-rust: FreeCAD FCStd file reader — ZIP + Document.xml → BOM data"

[dependencies]
zip = "2"
quick-xml = { version = "0.37", features = ["serialize"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
