[package]
name = "fcstd-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fcstd-read"
path = "src/main.rs"

[dependencies]
fcstd-reader = { path = "../fcstd-reader" }
phoenix-cad-protocol = { path = "../phoenix-cad-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
zip = "2"
