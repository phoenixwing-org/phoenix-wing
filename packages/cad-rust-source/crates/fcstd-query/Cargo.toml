[package]
name = "fcstd-query"
version = "0.4.2"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "fcstd_query"
path = "src/lib.rs"

[[bin]]
name = "fcstd-query"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
