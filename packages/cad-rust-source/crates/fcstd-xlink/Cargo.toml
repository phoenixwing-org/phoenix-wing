[package]
name = "fcstd-xlink"
version = "0.1.0"
edition = "2021"
description = "FreeCAD FCStd XLink attribute modification — Rust port of rename_analysis/xlink.py"

[dependencies]
phoenix-cad-protocol = { path = "../phoenix-cad-protocol" }
zip = "2"
quick-xml = "0.37"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
